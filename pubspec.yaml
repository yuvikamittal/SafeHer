name: safeher
description: "SafeHer — a personal safety companion for women."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Biometric unlock
  local_auth: ^2.3.0

  # GPS & location
  geolocator: ^13.0.2
  google_maps_flutter: ^2.9.0
  http: ^1.2.2
  geocoding: ^3.0.0

  # SOS dispatch
  telephony: ^0.2.0   # silent multi-recipient SMS (Android only)
  url_launcher: ^6.3.1 # tel:/sms: fallback dialer + composer

  # State management — keeps contacts / auth / location in sync across screens
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
